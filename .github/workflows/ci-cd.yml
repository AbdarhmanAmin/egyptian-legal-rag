name: CI and image delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install app and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: black --check src tests

      - name: Run API and retrieval tests
        run: pytest tests/test_api.py tests/test_search.py --cov-report=term --cov-report=xml

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  image:
    name: Build and publish container
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and publish from main
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME || 'local' }}/egyptian-legal-rag:${{ github.sha }}
            docker.io/${{ vars.DOCKERHUB_USERNAME || 'local' }}/egyptian-legal-rag:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
