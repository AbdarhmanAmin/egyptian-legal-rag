[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "egyptian-legal-rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pdfplumber",
    "sentence-transformers",
    "dvc>=3.0.0",
    "mlflow",
    "qdrant-client",
    "groq>=0.18.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "ragas>=0.2,<0.3",
    "datasets>=2.18,<4",
    "langchain-community>=0.3,<0.4",
    "langchain>=0.3,<1",
    "langchain-groq>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "black",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src"
