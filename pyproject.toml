[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "egyptian-legal-rag"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sentence-transformers",
    "qdrant-client",
    "groq>=0.18.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
]

[tool.setuptools]
packages = ["src", "src.api", "src.experiments", "src.ingestion", "src.rag"]

[project.optional-dependencies]
pipeline = [
    "dvc>=3.0.0",
    "mlflow",
    "pdfplumber",
]
evaluation = [
    "mlflow",
    "ragas>=0.2,<0.3",
    "datasets>=4.4,<5",
    "langchain-community>=0.3,<0.4",
    "langchain>=0.3,<1",
    "langchain-huggingface>=0.1,<1",
    "langchain-groq>=0.2,<1",
]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "black",
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src"
